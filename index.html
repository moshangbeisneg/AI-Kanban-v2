<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Kanban - 智能任务管理平台</title>
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
  <!-- App Bar -->
  <header class="app-bar">
    <div class="app-bar-left">
      <div class="app-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
        </svg>
        <span class="logo-text">AI Kanban</span>
      </div>
     <nav class="app-nav">
        <button class="nav-btn active" data-view="board">看板</button>
        <button class="nav-btn" data-view="timeline">时间线</button>
        <button class="nav-btn" data-view="stats">统计</button>
     </nav>
    </div>
    <div class="app-bar-right">
      <button class="primary-btn" id="addTaskBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新建任务
      </button>
    </div>
  </header>

  <!-- Main Layout -->
  <div class="main-layout">
    <!-- Board Container -->
    <div class="board-area">
     <div class="board-header">
       <div class="board-info"><h2>项目看板</h2><span class="board-subtitle" id="taskTotal">共 0 个任务</span></div>
       <div class="board-search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" id="searchInput" placeholder="搜索..." autocomplete="off"></div>
        <div class="board-actions">
          <button class="secondary-btn" id="batchModeBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            批量操作
          </button>
        </div>
     </div>
      <!-- Batch Toolbar -->
    <div class="filter-bar">
<div class="filter-group"><span class="filter-label">优先级</span><button class="filter-chip active" data-priority="">全部</button><button class="filter-chip" data-priority="high">高</button><button class="filter-chip" data-priority="medium">中</button><button class="filter-chip" data-priority="low">低</button></div>
<div class="filter-group"><div class="tag-multi" id="tagMulti"><button class="tag-multi-btn" id="tagMultiBtn">标签 ▾</button><div class="tag-multi-menu" id="tagMultiMenu"></div></div></div>
<button class="filter-clear" id="clearFiltersBtn" style="display:none">清除筛选</button>
    </div>
      <div class="batch-toolbar" id="batchToolbar" style="display:none">
        <label class="batch-select-all">
          <input type="checkbox" id="selectAllCheck">
          <span>全选</span>
        </label>
        <span class="batch-count" id="batchCount">已选 0 个</span>
        <div class="batch-actions">
          <select id="batchMoveSelect" class="batch-select">
            <option value="">移动到...</option>
            <option value="todo">待办事项</option>
            <option value="in-progress">进行中</option>
            <option value="done">已完成</option>
          </select>
          <button class="secondary-btn" id="batchMoveBtn" disabled>移动</button>
          <button class="danger-btn" id="batchDeleteBtn" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            删除
          </button>
          <button class="text-btn" id="batchExitBtn">退出</button>
        </div>
      </div>
     <div class="board-container" id="boardContainer">
       <!-- Columns rendered by JS -->
     </div>

      <!-- Timeline View -->
      <div class="view-container" id="viewTimeline" style="display:none"></div>

      <!-- Stats View -->
      <div class="view-container" id="viewStats" style="display:none"></div>

   </div>

   <!-- AI Panel Sidebar -->
   <aside class="ai-sidebar" id="aiPanel">
     <!-- Rendered by AI module -->
   </aside>
 </div>

  <!-- Task Modal -->
  <div class="modal-overlay" id="detailModal"><div class="modal-content"><div class="modal-header"><h2>任务详情</h2><button class="modal-close" onclick="Board.hideDetailModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div><div class="modal-body" id="detailBody"></div><div class="modal-footer"><button class="secondary-btn" onclick="Board.hideDetailModal()">关闭</button></div></div></div>
  <div class="modal-overlay" id="taskModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">新建任务</h2>
        <button class="modal-close" onclick="Board.hideTaskModal()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="taskForm">
        <input type="hidden" id="taskId">
        <input type="hidden" id="taskColId" value="todo">
        <div class="form-group">
          <label for="taskTitle">任务标题</label>
          <input type="text" id="taskTitle" placeholder="输入任务名称" required>
        </div>
        <div class="form-group">
          <label for="taskDesc">描述</label>
          <textarea id="taskDesc" rows="3" placeholder="任务详细描述（可选）"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="taskPriority">优先级</label>
            <select id="taskPriority">
              <option value="high">高</option>
              <option value="medium" selected>中</option>
              <option value="low">低</option>
            </select>
          </div>
          <div class="form-group">
            <label for="taskDeadline">截止日期</label>
            <input type="date" id="taskDeadline">
          </div>
        </div>
        <div class="form-group">
          <label for="taskTags">标签（逗号分隔）</label>
          <input type="text" id="taskTags" placeholder="例如: 前端, Bug, 紧急">
        </div>
        <div class="form-actions">
          <button type="button" class="secondary-btn" onclick="Board.hideTaskModal()">取消</button>
          <button type="submit" class="primary-btn">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/storage.js?v=2"></script>
  <script src="js/board.js?v=2"></script>
  <script src="js/ai.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
